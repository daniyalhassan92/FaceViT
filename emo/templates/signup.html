<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="utf-8">
    <title>Modern Signup Form</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #6B73FF 0%, #000DFF 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .signup-container {
            width: 100%;
            max-width: 500px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            overflow: hidden;
            animation: slideUp 0.6s ease-out;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .signup-header {
            background: linear-gradient(to right, #6B73FF, #000DFF);
            color: white;
            padding: 30px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .signup-header::after {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 100%;
            height: 200%;
            background: rgba(255, 255, 255, 0.1);
            transform: rotate(30deg);
        }

        .signup-header h1 {
            font-weight: 600;
            font-size: 28px;
            margin-bottom: 5px;
            position: relative;
            z-index: 1;
        }

        .signup-header p {
            font-weight: 300;
            opacity: 0.9;
            position: relative;
            z-index: 1;
        }

        .signup-form {
            padding: 30px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 15px;
        }

        .input-group {
            margin-bottom: 15px;
            position: relative;
        }

        .input-group.full-width {
            grid-column: span 2;
        }

        .input-group i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #6B73FF;
        }

        .input-group input {
            width: 100%;
            padding: 15px 15px 15px 45px;
            border: 2px solid #e6e6e6;
            border-radius: 8px;
            font-size: 15px;
            transition: all 0.3s;
        }

        .input-group input:focus {
            border-color: #6B73FF;
            outline: none;
            box-shadow: 0 0 0 3px rgba(107, 115, 255, 0.2);
        }

        .password-container {
            position: relative;
        }

        .show-hide {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #6B73FF;
            font-weight: 500;
            font-size: 14px;
            user-select: none;
        }

        .signup-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(to right, #6B73FF, #000DFF);
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin: 20px 0 15px;
        }

        .signup-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(107, 115, 255, 0.4);
        }

        .login-link {
            text-align: center;
            color: #666;
            font-size: 15px;
        }

        .login-link a {
            color: #6B73FF;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s;
        }

        .login-link a:hover {
            color: #000DFF;
            text-decoration: underline;
        }

        /* Responsive adjustments */
        @media (max-width: 600px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
            
            .input-group.full-width {
                grid-column: span 1;
            }
            
            .signup-container {
                border-radius: 10px;
            }
            
            .signup-header {
                padding: 25px 20px;
            }
            
            .signup-form {
                padding: 25px 20px;
            }
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" />
</head>

<body>
    <div class="signup-container">
        <div class="signup-header">
            <h1>Create Your Account</h1>
            <p>Join us today and get started</p>
        </div>
        
        <form class="signup-form" action="{% url 'signup' %}" method="post">
            {% csrf_token %}
            <div class="form-grid">
                <div class="input-group">
                    <i class="fas fa-user"></i>
                    <input type="text" name="username" required placeholder="Username">
                </div>
                
                <div class="input-group">
                    <i class="fas fa-user"></i>
                    <input type="text" name="fname" required placeholder="First Name">
                </div>
                
                <div class="input-group">
                    <i class="fas fa-user"></i>
                    <input type="text" name="lname" required placeholder="Last Name">
                </div>
                
                <div class="input-group full-width">
                    <i class="fas fa-envelope"></i>
                    <input type="email" name="email" required placeholder="Email">
                </div>
                
                <div class="input-group full-width password-container">
                    <i class="fas fa-lock"></i>
                    <input type="password" class="password-input" name="password1" required placeholder="Password">
                    <span class="show-hide">SHOW</span>
                </div>
                
                <div class="input-group full-width">
                    <i class="fas fa-lock"></i>
                    <input type="password" name="password2" required placeholder="Confirm Password">
                </div>
            </div>
            
            <button type="submit" class="signup-btn">CREATE ACCOUNT</button>
        </form>
        
        <div class="login-link">
            Already have an account? <a href="/signin/">Sign in now</a>
        </div>
    </div>

    <script>
        const passwordInput = document.querySelector('.password-input');
        const showHideBtn = document.querySelector('.show-hide');
        
        showHideBtn.addEventListener('click', function() {
            if (passwordInput.type === "password") {
                passwordInput.type = "text";
                showHideBtn.textContent = "HIDE";
                showHideBtn.style.color = "#000DFF";
            } else {
                passwordInput.type = "password";
                showHideBtn.textContent = "SHOW";
                showHideBtn.style.color = "#6B73FF";
            }
        });
    </script>
</body>
</html>
